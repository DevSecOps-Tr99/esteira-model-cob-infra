#cloud-config
# VM do GitHub Actions self-hosted runner (o "runner dentro da rede").
# Instala so as dependencias; o registro no repositorio e feito depois por
# runner/registrar-runner.sh (precisa de um token de registro que
# expira em 1h, por isso nao fica aqui).
package_update: true
packages:
  - python3
  - python3-venv
  - python3-pip
  - git
  - jq
  - curl
  - unzip
  - openssh-client

users:
  - default
  - name: ghrunner
    shell: /bin/bash
    lock_passwd: true

runcmd:
  # az CLI - o azure/login do workflow usa o az do runner
  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
  - install -d -m 0755 -o ghrunner -g ghrunner /opt/actions-runner
